<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueceu sua senha? - VITA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script type="module" src="js/script.js"></script>
    <div class="auth-container-full">
        <a href="login.html" class="back-arrow" title="Voltar ao Login">&larr;</a>

        <div class="auth-card">
            <img src="Vector.png" alt="VITA Logo" class="auth-logo">
            <h1 class="auth-title">Esqueceu sua senha?</h1>
            <p style="color: #a0aec0; font-size: 14px; margin-bottom: 28px;">Digite o e-mail utilizado na sua conta.</p>

            <form class="auth-form" id="forgot-form">
                <div class="input-group">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                    <input type="email" id="forgot-email" placeholder="Email" required>
                </div>

                <p id="forgot-error" style="display:none; color:#ef4444; font-size:13px; margin:-10px 0 10px;"></p>

                <button type="submit" class="btn-full-green">Receber e-mail</button>
            </form>

            <p style="color: #a0aec0; font-size: 12px; margin-top: 24px; line-height: 1.5;">
                Caso sua conta exista, você receberá um e-mail para redefinir sua senha.
            </p>
        </div>
    </div>

</body>
</html>
