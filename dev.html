<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Dev - VITA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script type="module" src="js/script.js"></script>
    <div class="auth-container">
        <div class="auth-sidebar">
            <a href="index.html" style="position: absolute; top: 30px; left: 30px; color: #ffffff; text-decoration: none;">&larr; Voltar ao site</a>
            <div class="auth-sidebar-content">
                <img src="Vector.png" alt="VITA Logo">
                <p>Sua saúde começa aqui.</p>
            </div>
        </div>

        <div class="auth-main">
            <div class="auth-card">
                <img src="Vector.png" alt="VITA Logo" class="auth-logo">
                <h1 class="auth-title">Acesso do desenvolvedor</h1>
                
                <div class="auth-subtitle-row">
                    <span>Esqueceu sua senha?</span>
                    <a href="esqueceusenha.html" class="badge-pill">Redefinir senha</a>
                </div>

                <form class="auth-form" id="dev-login-form">
                    <div class="input-group">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                        <input type="email" id="dev-email" placeholder="Email" required>
                    </div>

                    <div class="input-group">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        <input type="password" id="dev-password" placeholder="••••••••" required>
                        <span class="toggle-eye" id="toggle-password">👁️</span>
                    </div>

                    <p id="login-error" style="display:none; color:#ef4444; font-size:13px; margin:-10px 0 10px;"></p>

                    <button type="submit" class="btn-full-green">Entrar</button>
                </form>

                <div style="margin-top: 25px; font-size: 13px; color: #718096;">
                    Não é desenvolvedor? <a href="login.html" style="color: #63b3ed; text-decoration: underline;">Acesse o login padrão</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
